# Render Blueprint: one free web service serves the dashboard, the REST API,
# the dashboard WebSocket (/api/ws) and the controller WebSocket (/api/device-ws)
# over a single HTTPS URL. The database is an external free Postgres (Neon).
#
# Secrets use `sync: false`, so Render asks for them in the dashboard on first
# deploy and they never live in this repo.
services:
  - type: web
    name: rfid-access-control
    runtime: node
    plan: free
    region: singapore # closest free region to India; change if you prefer
    branch: main
    autoDeploy: true
    healthCheckPath: /api/healthz
    buildCommand: >-
      npm install -g pnpm@11.10.0 &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @workspace/db run push &&
      pnpm --filter @workspace/rfid-dashboard run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # LAN-only transports (raw TCP / UDP broadcast / mDNS) cannot run on a cloud host.
      - key: ENABLE_LAN_SERVICES
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL # Neon connection string (…?sslmode=require)
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD # 10+ characters; the app refuses to start with "admin"
        sync: false
      - key: DEVICE_AUTH_SECRET # same value goes into the ESP32 firmware (DEVICE_AUTH_KEY)
        sync: false
